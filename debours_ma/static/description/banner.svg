  <rect x="95" y="442" width="470" height="67" rx="16" fill="#FFFFFF" opacity="0.94"/>
  <circle cx="132" cy="476" r="11" fill="url(#accent)"/>
  <text x="158" y="485" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0A3D62">TVA régime encaissement maîtrisée</text>

