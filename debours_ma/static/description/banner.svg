  </defs>

  <rect width="1280" height="720" fill="url(#mainBg)"/>
  <circle cx="120" cy="90" r="170" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="1190" cy="640" r="260" fill="#FFFFFF" opacity="0.06"/>
  <rect x="55" y="85" width="580" height="550" rx="28" fill="#FFFFFF" opacity="0.07"/>

  <text x="95" y="170" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">Debours Maroc</text>
  <text x="95" y="223" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#D5EEF7">Gestion complète des débours sous Odoo 19</text>

  <rect x="95" y="270" width="470" height="67" rx="16" fill="#FFFFFF" opacity="0.94"/>
  <circle cx="132" cy="304" r="11" fill="url(#accent)"/>
