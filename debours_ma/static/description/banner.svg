  <circle cx="760" cy="309" r="12" fill="url(#accent)"/>
  <circle cx="760" cy="389" r="12" fill="url(#accent)"/>
  <circle cx="760" cy="469" r="12" fill="url(#accent)"/>

  <text x="790" y="318" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0A3D62">Saisie des frais avancés</text>
  <text x="790" y="398" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0A3D62">Validation et facturation</text>
  <text x="790" y="478" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0A3D62">Paiement et clôture dossier</text>
